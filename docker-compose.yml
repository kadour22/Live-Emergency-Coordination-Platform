services:

  web:
    build: .
    container_name: emergency_web
    ports:
      - "7000:7000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - SECRET_KEY=django-insecure-z2h=3m18bvb11t8($&g2$hg(0y4zuhp&)l__x@v0g5b(@xb=c-
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emergency_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
